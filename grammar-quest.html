<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>Grammar Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: Duolingo-style path. Home = book chapters → units (numbered like the book) → lesson nodes. Lesson = progress bar + hearts, exercise, bottom check sheet. Nautical signal-flag identity carried over from English Quest. */
:root{
  --bg:#E8F0F0; --paper:#FBFDFC; --fg:#0E2233; --muted:#5A7083; --line:#C7D7DA;
  --sea:#0F4C75; --sea-deep:#0A3352; --sea-tint:#DCEAF4; --on-sea:#FFFFFF;
  --signal:#F2B200; --signal-deep:#B78600; --heart:#D7263D;
  --ok:#1C8556; --ok-deep:#12603D; --ok-bg:#DDF2E6; --bad:#C2283A; --bad-deep:#8E1B2A; --bad-bg:#FBE2E5; --lock:#CBD6DC; --lock-deep:#A7B5BD;
  --font-d:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1722; --paper:#13263A; --fg:#E6EEF3; --muted:#93A8B8; --line:#26405A;
  --sea:#6FB2E6; --sea-deep:#3F7FB1; --sea-tint:#183553; --on-sea:#06192A;
  --signal:#F5C440; --signal-deep:#B88E1D; --heart:#FF5468;
  --ok:#4CCB8C; --ok-deep:#2E8F5F; --ok-bg:#103426; --bad:#FF6F7D; --bad-deep:#B9404D; --bad-bg:#3A1820; --lock:#2A3D50; --lock-deep:#1C2C3C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1722; --paper:#13263A; --fg:#E6EEF3; --muted:#93A8B8; --line:#26405A;
  --sea:#6FB2E6; --sea-deep:#3F7FB1; --sea-tint:#183553; --on-sea:#06192A;
  --signal:#F5C440; --signal-deep:#B88E1D; --heart:#FF5468;
  --ok:#4CCB8C; --ok-deep:#2E8F5F; --ok-bg:#103426; --bad:#FF6F7D; --bad-deep:#B9404D; --bad-bg:#3A1820; --lock:#2A3D50; --lock-deep:#1C2C3C; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
#app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.top{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:800;font-size:17px;margin-right:auto}
.kilo{width:26px;height:18px;display:flex;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.kilo i{flex:1;background:var(--signal)} .kilo i+i{background:var(--sea)}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 10px}
.stat.dim{opacity:.55}
.ring{width:20px;height:20px}
.ring circle{fill:none;stroke-width:4}
.iconbtn{border:2px solid var(--line);background:var(--paper);border-radius:12px;width:38px;height:36px;display:grid;place-items:center;font-size:16px}

/* livello */
.lvl{display:flex;align-items:center;gap:10px}
.lvl b{font-family:var(--font-d);font-size:14px;background:var(--signal);color:#1d1600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.bar{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--signal);border-radius:999px;transition:width .5s}
.lvl small{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* mappa */
.themes{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px}
.thead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.tsub{font-size:13px;color:var(--muted);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tbtn{border:none;border-radius:16px;background:var(--tc);color:#fff;box-shadow:0 5px 0 var(--tcd);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;text-align:left;align-items:center}
.tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tcd)}
.tbtn .ti{grid-row:1/3;font-size:28px;line-height:1}
.tbtn .tn{font-weight:800;font-size:15px;line-height:1.15}
.tbtn .tc{font-size:12px;font-weight:700;opacity:.9}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:5px}
.tab{border:none;background:transparent;border-radius:12px;padding:8px 4px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.tab span{font-size:20px}
.tab.on{background:var(--sea);color:var(--on-sea)}
.lead{margin:0;color:var(--muted);font-weight:600}
.tbtn.big2{grid-template-columns:auto 1fr;padding:14px}
.tbtn.big2 .tc{grid-column:1/3;margin-top:6px}
.wgrid{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;color:var(--fg)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cbtn{border:2px solid var(--line);background:var(--paper);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;box-shadow:0 4px 0 var(--line)}
.cbtn .ci{font-size:34px;line-height:1}.cbtn .cn{font-family:var(--font-d);font-weight:800;font-size:17px;line-height:1.15}.cbtn .cf{font-size:13px;color:var(--muted);font-weight:700}
.badge-new{align-self:center;background:var(--heart);color:#fff;border-radius:999px;padding:2px 12px;font-weight:800;letter-spacing:.06em;font-size:13px}
.vword{font-family:var(--font-d);font-weight:800;font-size:34px;line-height:1.1}
.vpast{font-size:17px;color:var(--muted)}
.vit{font-weight:800;font-size:19px;color:var(--sea)}
.vin{width:100%;font:inherit;font-size:20px;font-weight:700;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--fg)}
.dhead{display:flex;gap:12px;align-items:center}
.dhead small{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex}.msg.me{justify-content:flex-end}
.mb{max-width:85%;background:var(--paper);border:2px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px;font-weight:700;font-size:17px}
.msg.me .mb{background:var(--sea-tint);border-color:var(--sea);border-radius:16px 16px 4px 16px}
.mit{font-weight:600;font-size:14px;color:var(--muted);margin-top:4px}
.trb{border:none;background:none;font-size:15px;padding:0 2px;cursor:pointer}
.corr{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;color:var(--fg)}
.typing{letter-spacing:4px;color:var(--muted)}
.player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:4;background:var(--paper);border:2px solid var(--sea);border-radius:18px;padding:10px 12px;display:grid;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.pbtns{display:flex;justify-content:center;gap:10px}
.pb{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:20px}
.pb.main{width:64px;height:48px;background:var(--sea);color:var(--on-sea);border-color:var(--sea);font-size:22px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.speeds{display:flex;gap:4px}
.sp{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.sp.on{background:var(--signal);border-color:var(--signal-deep);color:#1d1600}
.pstep{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.srow{transition:background .2s,box-shadow .2s}
.srow.now{background:color-mix(in srgb,var(--signal) 22%,var(--paper));box-shadow:inset 4px 0 0 var(--signal)}
.spd{display:inline-flex;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap;color:var(--fg);overflow:hidden}
.spm{border:none;background:var(--bg);width:30px;height:30px;font-size:19px;font-weight:800;line-height:1;color:var(--fg);cursor:pointer}
.spm[disabled]{opacity:.3;cursor:default}
.spv{padding:0 7px;font-variant-numeric:tabular-nums}
.lbar .spd{flex:none}
.tab{font-size:11.5px!important;padding:8px 2px!important}
.aplayer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:4;background:var(--paper);border:2px solid var(--sea);border-radius:18px;padding:12px;display:grid;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.aplayer .now{font-weight:800;font-family:var(--font-d);font-size:16px;min-height:22px}
.aseek{width:100%;accent-color:var(--sea)}
.atime{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.abtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ab{min-width:46px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px;font-weight:800;padding:0 8px}
.ab.main{min-width:60px;background:var(--sea);color:var(--on-sea);border-color:var(--sea);font-size:20px}
.ab.on{background:var(--signal);border-color:var(--signal-deep);color:#1d1600}
.trk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.trk.cur{border-color:var(--sea);background:var(--sea-tint)}
.trk .tp{width:38px;height:38px;border-radius:10px;border:none;background:var(--sea);color:var(--on-sea);font-size:16px}
.trk .tn{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .tn small{display:block;font-weight:600;color:var(--muted)}
.btn.red{background:var(--heart);color:#fff;box-shadow:0 4px 0 var(--bad-deep,#8f1424)}
.trk .tn{background:none;border:none;text-align:left;font:inherit;font-weight:800;color:var(--fg);padding:0;cursor:pointer}
.tcode{display:inline-block;flex:none;font-family:var(--font-d);font-weight:800;font-size:14px;background:var(--sea);color:var(--on-sea);border-radius:8px;padding:4px 8px;white-space:nowrap}
.tcode.sm{font-size:12px;padding:2px 6px;border-radius:6px;vertical-align:1px}
.study{border-color:var(--sea)}
.sthead{display:flex;gap:10px;align-items:flex-start}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:none;background:transparent;border-radius:9px;padding:9px 4px;font:inherit;font-weight:800;font-size:14px;color:var(--fg)}
.seg button.on{background:var(--paper);box-shadow:0 2px 0 var(--line);color:var(--sea)}
.bkbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bkp{font-weight:800}
.lnk{border:none;background:none;color:var(--sea);font:inherit;font-weight:700;text-decoration:underline;padding:0 4px}
.bkbox{overflow:auto;max-height:78vh;border:2px solid var(--line);border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch}
.bkbox canvas{display:block;margin:0 auto;max-width:none}
.atext{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--fg);resize:vertical}
.fbx{background:var(--sea-tint);border:2px solid var(--sea);border-radius:12px;padding:10px 12px}
.warn{margin:0;background:color-mix(in srgb,var(--signal) 22%,var(--paper));border:2px solid var(--signal-deep);border-radius:12px;padding:8px 10px;font-size:14px}
.hbrow{font-size:14px;font-weight:700;align-items:flex-start;padding:10px 12px}
.fsel{flex:1;font:inherit;font-weight:700;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--fg);min-width:0}
.chk{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700}
.trlist{display:grid;gap:2px;max-height:55vh;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--paper)}
.trlist.hid .trl span{filter:blur(6px);transition:filter .2s}
.trlist.hid .trl:hover span,.trlist.hid .trl.now span{filter:none}
.trl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px;border-radius:8px}
.trl.now{background:color-mix(in srgb,var(--signal) 25%,var(--paper))}
.trl span{font-weight:600;line-height:1.4}
.trt{border:none;background:var(--sea-tint);color:var(--sea);font:inherit;font-size:12px;font-weight:800;border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.trab{border:none;background:none;font-size:15px;padding:2px}
.meter .indet{display:block;height:100%;width:30%;background:var(--sea);border-radius:inherit;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}
.aplayer{padding:8px 10px!important;gap:5px!important}
.aplayer .ab{height:38px;min-width:40px;font-size:15px}
.aplayer .ab.main{min-width:54px}
.arsel{font:inherit;font-weight:800;color:var(--fg)}
.akeys{margin:0;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:640px){.akeys{display:none}}
#astudy{scroll-margin-top:190px}
.msay{border:2px solid var(--line);background:var(--paper);border-radius:999px;min-width:34px;height:34px;font-size:15px;margin-left:4px;padding:0 6px;vertical-align:middle;flex:none}
.msay.on{background:var(--ok);border-color:var(--ok);animation:mpulse 1s infinite}
.msay.off{opacity:.45}
@keyframes mpulse{50%{transform:scale(1.12)}}
#pronbox{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);width:min(520px,calc(100% - 32px));background:var(--paper);border:3px solid var(--sea);border-radius:18px;padding:12px 14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);display:grid;gap:6px;transition:transform .25s}
#pronbox.show{transform:translate(-50%,0)}#pronbox.ok{border-color:var(--ok)}#pronbox.bad{border-color:var(--bad)}
#pronbox b{font-size:18px}#pronbox .pw{font-weight:800;font-size:18px;line-height:1.5}#pronbox small{color:var(--muted)}
#pronbox .px{position:absolute;right:8px;top:6px;border:none;background:none;font-size:18px;color:var(--muted)}
.trk select{font:inherit;font-size:13px;font-weight:700;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:4px}
.hwrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 var(--line)}
.hwrow:active{transform:translateY(2px)}
.hwn{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:18px;color:#fff;background:var(--hc)}
.hwt{flex:1;min-width:0}.hwt b{display:block;font-family:var(--font-d);font-size:17px}.hwt small{color:var(--muted);font-weight:700}
.hwp{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hwp.full{color:var(--ok)}
.hwcheck{width:100%;border:2px dashed var(--signal-deep);background:color-mix(in srgb,var(--signal) 14%,var(--paper));border-radius:16px;padding:10px 12px;font-weight:800;text-align:left}
.guide{margin:0;padding-left:20px;display:grid;gap:6px}
.guide i{color:var(--sea);font-style:normal;font-weight:700}
.chapter{background:var(--fg);color:var(--bg);border-radius:16px;padding:9px 14px;font-family:var(--font-d);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.chapter span{opacity:.7}
.unit{border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--uc);color:#fff;box-shadow:0 5px 0 var(--ucd)}
.unit.soon{background:var(--paper);color:var(--muted);box-shadow:none;border:2px dashed var(--line);padding:9px 14px}
.unit .num{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:20px}
.unit.soon .num{background:var(--bg);font-size:16px;width:36px;height:36px}
.unit .tt{flex:1;min-width:0}
.unit small{display:block;font-size:12px;font-weight:800;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.unit b{font-family:var(--font-d);font-size:19px;line-height:1.15;display:block}
.unit.soon b{font-size:15px;font-weight:700;font-family:var(--font-b)}
.ubtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.unit{flex-wrap:wrap}.unit .tt{flex:1 1 calc(100% - 60px)}.ubtns{flex-basis:100%;justify-content:flex-start;padding-left:56px}}
.ubtn{border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:44px 0 18px}
.node{position:relative;width:72px;height:66px;border-radius:50%;border:none;font-size:28px;display:grid;place-items:center;color:#fff;background:var(--uc);box-shadow:0 7px 0 var(--ucd)}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ucd)}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-deep)}
.node.lock span{opacity:.55}
.node.done{background:var(--signal);box-shadow:0 7px 0 var(--signal-deep)}
.node.now{animation:bob 1.6s ease-in-out infinite}
.node.now::before{content:"";position:absolute;inset:-11px;border-radius:50%;border:5px solid color-mix(in srgb,var(--uc) 35%,transparent)}
.start{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--paper);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:2px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.start::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translateY(-5px)}}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;border:none;border-radius:20px;background:var(--heart);color:#fff;font-weight:800;padding:14px 16px;box-shadow:0 6px 0 var(--bad-deep);font-size:16px;display:flex;align-items:center;gap:6px}
.fab.mic{position:fixed;right:max(16px,env(safe-area-inset-right,0px));z-index:6;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--sea);box-shadow:0 6px 0 var(--sea-deep)}
.fab[disabled]{background:var(--lock);box-shadow:0 6px 0 var(--lock-deep);color:var(--muted)}

/* guida e schermate */
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h1,.center h1{font-family:var(--font-d);font-weight:800;font-size:clamp(24px,6vw,30px);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em}
.card ul{margin:0;padding-left:20px;display:grid;gap:8px;max-width:62ch}
.card li i{color:var(--sea);font-style:normal;font-weight:700}
.ex{display:grid;gap:6px}

.chip small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* lezione */
.lbar{display:flex;align-items:center;gap:12px;padding-block:6px}
.x{border:none;background:none;font-size:24px;color:var(--muted);width:40px;height:40px;border-radius:10px}

.prog{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}

.hearts{font-weight:800;color:var(--heart);white-space:nowrap;font-variant-numeric:tabular-nums}

.combo{font-weight:800;color:var(--signal-deep);font-size:14px;text-align:right;min-height:20px}
.task{font-family:var(--font-d);font-weight:800;font-size:clamp(21px,5vw,26px);line-height:1.2;margin:0;text-wrap:balance}
.prompt{display:flex;gap:12px;align-items:flex-start}

.bubble{flex:1;min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px;font-weight:700}

.gap{display:inline-block;min-width:64px;border-bottom:3px solid var(--sea);margin:0 3px;color:var(--sea)}

.opt:active{transform:translateY(2px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--sea);background:var(--sea-tint);box-shadow:0 3px 0 var(--sea)}
.line{min-height:104px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start;background:repeating-linear-gradient(transparent 0 50px,var(--line) 50px 52px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:8px}
.tile{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);font-size:17px;height:42px}

textarea{width:100%;min-height:110px;font:inherit;font-size:18px;font-weight:700;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--fg);resize:vertical}
textarea:focus{border-color:var(--sea);outline:none}
.listen{display:flex;gap:12px;justify-content:center;align-items:flex-end}

.exl span{color:var(--muted);font-weight:600}
.btn.small{padding:10px;font-size:14px}

.btn{width:100%;border:none;border-radius:14px;padding:15px;font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-deep)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

 6:{ guide:[

   "Gli avverbi di frequenza (always, usually, often, never) vanno prima del verbo: <i>I always drink coffee</i>."],

   ["I [live] in Messina.","Vivo a Messina.",["lives","living"],"Con I il verbo resta senza -s."],
   ["My son [goes] to school by car.","Mio figlio va a scuola in macchina.",["go","gos"],"go → goes (con -ES)."],
   ["He [watches] TV every evening.","Lui guarda la TV ogni sera.",["watchs","watch"],"I verbi in -ch, -sh, -s, -x aggiungono -ES: watches."],
   ["The shop [opens] at nine.","Il negozio apre alle nove.",["open","opening"],"The shop = it → opens."],
   ["We [play] tennis on Sundays.","Giochiamo a tennis la domenica.",["plays","playing"],"Con we niente -s."],

   ["She [studies] English.","Lei studia inglese.",["studys","study"],"Consonante + y → -IES: study → studies."],
   ["I always [drink] coffee in the morning.","Bevo sempre il caffè la mattina.",["drinks","am drink"],"Con I il verbo è base; always va prima del verbo."],
   ["My father [has] a boat.","Mio padre ha una barca.",["have","haves"],"have → HAS con he/she/it."]

 9:{ guide:[

   ["Do you [know] that man?","Conosci quell'uomo?",["knowing","are knowing"],"Know è un verbo di stato: Do you know...?"],
   ["He usually [drives] to work, but today he is walking.","Di solito va al lavoro in macchina, ma oggi va a piedi.",["is driving","drive"],"Usually = abitudine → drives."],
   ["What [do you do]? I'm an engineer.","Che lavoro fai? Sono un ingegnere.",["are you doing","you do"],"What do you do? = che lavoro fai."],

 10:{ guide:[

   ["[Does] your office have a parking area?","Il tuo ufficio ha un parcheggio?",["Has","Do"],"Con have semplice la domanda vuole Does... have?"],
   ["I [have] breakfast at seven.","Faccio colazione alle sette.",["have got","do"],"Fare colazione = have breakfast. Con le azioni mai have got."],
   ["They [have got] a new house.","Hanno una casa nuova.",["has got","have get"],"They → have got.",["they have a new house"]]

 11:{ guide:[

 15:{ guide:[

 16:{ guide:[

 { n:7, title:"Then and now", it:"Il passato", ic:"📜",

    ["She [started] work when she was eighteen.","Ha cominciato a lavorare a diciotto anni.",["start","startted"],"Regolare: start → started."],
    ["He [left] school in 1994.","Ha lasciato la scuola nel 1994.",["leaved","leave"],"leave → LEFT."],
    ["We [moved] to Messina in 2010.","Ci siamo trasferiti a Messina nel 2010.",["move","moveed"],"move → moved (basta -d)."],
    ["They [got] married last year.","Si sono sposati l'anno scorso.",["getted","get"],"get → GOT."],

   verbs:[["marry","married","sposare","He married a girl from Naples.","Ha sposato una ragazza di Napoli."],["die","died","morire","The old king died in 1900.","Il vecchio re è morto nel 1900."],["become","became","diventare","She became a doctor.","È diventata medico."],["begin","began","cominciare","The party began at eight.","La festa è cominciata alle otto."]],

 { n:10, title:"Bigger and better!", it:"Confronti", ic:"🏙️",
   guide:["Comparativi: aggettivi corti + <b>-er</b> (<i>cheap → cheaper</i>), lunghi con <b>more</b> (<i>more expensive</i>), sempre con <b>than</b>.","Superlativi: <b>the -est</b> (<i>the cheapest</i>), <b>the most</b> (<i>the most expensive</i>).","Ortografia: <i>big → bigger, noisy → noisier</i>. Irregolari: <i>good → better → the best, bad → worse → the worst</i>.","<b>have got</b>: <i>London's got a lot of parks. I haven't got much money.</i>"],
   items:[
    ["The country is [cheaper] than the city.","La campagna è più economica della città.",["more cheap","cheapest"],"Corto: cheap → cheaper + than."],
    ["London is [bigger] than Messina.","Londra è più grande di Messina.",["more big","biger"],"big → bigger (raddoppia la g)."],
    ["This hotel is [more expensive] than that one.","Questo albergo è più caro di quello.",["expensiver","most expensive"],"Lungo: MORE expensive."],
    ["It's the [most expensive] hotel in London.","È l'albergo più caro di Londra.",["more expensive","expensivest"],"Superlativo lungo: THE MOST."],
    ["Everest is the [highest] mountain in the world.","L'Everest è la montagna più alta del mondo.",["higher","most high"],"Superlativo corto: THE + -EST."],
    ["My car is [better] than yours.","La mia auto è migliore della tua.",["gooder","more good"],"good → BETTER (irregolare)."],
    ["The city is [noisier] than the country.","La città è più rumorosa della campagna.",["noisyer","more noisy"],"noisy → noisier (y → ier)."],
    ["London's [got] a lot of parks.","Londra ha molti parchi.",["have","get"],"London has got = London's got."]],
   words:[["noisy","rumoroso","The street is very noisy.","La strada è molto rumorosa."],["dirty","sporco","The river is dirty.","Il fiume è sporco."],["safe","sicuro","This area is safe at night.","Questa zona è sicura di notte."],["exciting","emozionante","New York is an exciting city.","New York è una città emozionante."],["crowded","affollato","The beach is crowded in August.","Ad agosto la spiaggia è affollata."],["polluted","inquinato","Big cities are polluted.","Le grandi città sono inquinate."],["village","il paesino","My grandparents live in a village.","I miei nonni vivono in un paesino."],["field","il campo","There are cows in the field.","Ci sono mucche nel campo."]],

const KEY="grammar-quest-v1";
function defP(){ return {stars:0,xp:0,pos:0,items:{},hearts:MAXH,hTs:Date.now(),streak:0,last:"",day:{d:"",xp:0},goal:30,extra:{},sound:true,trophies:[]}; }

const SHOP=[{n:1,cost:10,label:"1 cuore"},{n:3,cost:25,label:"3 cuori"},{n:5,cost:40,label:"5 cuori"}];
function buy(item){
  regen();
  const room=CAPH-P.hearts;
  if(room<=0){ toast("Hai già il massimo di cuori (10)"); return false; }
  if(P.stars<item.cost){ toast("Ti servono "+(item.cost-P.stars)+" ⭐ in più"); beep("bad"); return false; }
  const got=Math.min(item.n,room);
  P.stars-=item.cost; P.hearts+=got; regen(); save(); beep("ok");
  toast("❤️ +"+got+(got===1?" cuore":" cuori")+" · ora hai "+P.hearts+" ❤️ e "+P.stars+" ⭐");
  return true;
}
function saveLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
function save(){ P.savedAt=Date.now(); saveLocal(); scheduleCloud(); }

/* salvataggio nel tuo account Claude: stessi progressi su tutti i dispositivi (solo versione online) */
let cloud=null, cloudState="off", cloudTimer=null, cloudBusy=false, cloudDirty=false;
async function cloudInit(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db || !user) return;
    const id=await user.id(); if(!id) return;
    cloud=db.collection("data/users/"+id).doc("progress"); cloudState="sync";
    const snap=await cloud.get();
    const remote=snap.exists ? (snap.data()||{}).p : null;
    if(remote && (remote.savedAt||0)>(P.savedAt||0)){
      if(screen==="home"){ P=Object.assign(defP(),remote); saveLocal(); render(); toast("☁️ Progressi caricati dal tuo account"); }
      cloudState="ok";
    } else { await pushCloud(); }
    cloudState=cloudState==="err"?"err":"ok"; if(screen==="backup") render();
  }catch(e){ cloudState="err"; }
}
function scheduleCloud(){ if(!cloud) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(pushCloud,1500); }
async function pushCloud(){
  if(!cloud) return;
  if(cloudBusy){ cloudDirty=true; return; }
  cloudBusy=true;
  try{ await cloud.set({p:JSON.parse(JSON.stringify(P)),v:1}); cloudState="ok"; }catch(e){ cloudState="err"; }
  cloudBusy=false;
  if(cloudDirty){ cloudDirty=false; pushCloud(); }
  if(screen==="backup") render();
}

/* suggerimenti al passaggio del mouse (o al tocco) */
function hintify(text,lang){
  const D=lang==="en"?DICT_EN:DICT_IT, PH=lang==="en"?PHRASES_EN:PHRASES_IT;
  const toks=String(text).match(/\S+\s*|\s+/g)||[];
  const clean=t=>t.trim().toLowerCase().replace(/[’‘]/g,"'").replace(/^[^a-zàèéìòù]+|[^a-zàèéìòù']+$/g,"").replace(/'+$/,"");
  let out="",i=0;
  while(i<toks.length){
    if(/^\s+$/.test(toks[i])){ out+=toks[i]; i++; continue; }
    let done=false;
    for(let n=Math.min(5,toks.length-i);n>=2&&!done;n--){
      const grp=toks.slice(i,i+n), key=grp.map(clean).join(" ");
      if(PH[key]){ const raw=grp.join(""), body=raw.trimEnd(), tail=raw.slice(body.length);
        out+=`<span class="hw" data-t="${esc(PH[key])}" data-l="${lang}">${esc(body)}</span>${tail}`; i+=n; done=true; }
    }
    if(done) continue;
    const t=toks[i], body=t.trimEnd(), tail=t.slice(body.length), w=clean(t);
    const tr=D[w]||D[w.replace(/^l'|^un'|^dov'|^quell'/,"")];
    out+= tr ? `<span class="hw" data-t="${esc(tr)}" data-l="${lang}">${esc(body)}</span>${tail}` : esc(t);
    i++;
  }
  return out;
}

  const unitKeys=u=>UNITS[u].items.map((_,i)=>u+":"+i);
  if(node.t==="lesson"){
    const ks=shuffle(unitKeys(node.u)).slice(0,8);
    const seq=node.n===1?["gap","gap","build","gap","listen","build","gap","build"]:["gap","build","type","listen","type","build","type","listen"];
    ks.forEach((k,i)=>ex.push(mk(seq[i],k)));
    reviewPick(2,node.u).forEach((k,i)=>ex.splice(3+i*3,0,mk(i?"type":"build",k)));
    if(speakAvailable()){ ex.splice(node.n===1?6:4,0,{t:"speak",k:ks[0]}); ex.push({t:"speak",k:ks[1]}); }
  } else if(node.t==="trophy"){
    const ks=shuffle(unitKeys(node.u));
    const seq=["type","listen","type","build","type","listen","gap","type","build","listen"];
    ks.forEach((k,i)=>ex.push(mk(seq[i%seq.length],k)));
    if(UNITS[node.u].pairs) ex.splice(4,0,{t:"pairs",pairs:shuffle(UNITS[node.u].pairs).slice(0,5)});
    if(speakAvailable()){ ex.splice(3,0,{t:"speak",k:ks[0]}); ex.push({t:"speak",k:ks[1]}); }
  } else if(node.t==="theme"){
    const th=THEMES.find(t=>t.id===node.th), ks=shuffle(themeKeysAllowed(th)).slice(0,9);
    const seq=["gap","build","listen","gap","type","build","listen","type","gap"];

  } else if(node.t==="speakdrill"&&node.keys){
    shuffle(node.keys.filter(k=>IT[k])).slice(0,6).forEach(k=>ex.push({t:"speak",k}));

  let xp=n.t==="trophy"?20:n.t==="jump"?15:10; if(perfect) xp+=5;
  const t=today(); let streakUp=false;
  if(P.last!==t){ P.streak=P.last===yesterday()?P.streak+1:1; P.last=t; streakUp=true; }
  const goalBefore=dayXp()>=P.goal;
  addXp(xp);
  let heartBonus=0;
  if(n.t==="practice"){ const before=P.hearts; P.hearts = perfect ? CAPH : Math.min(CAPH,P.hearts+2); heartBonus=P.hearts-before; regen(); }
  if(n.t==="jump"){ P.pos=Math.max(P.pos,firstNodeOf(n.u)); }
  else if(L.idx===P.pos && L.idx>=0) P.pos++;
  if(n.t==="trophy" && !P.trophies.includes(n.u)) P.trophies.push(n.u);
  if(n.t==="theme"){ P.themes=P.themes||{}; P.themes[n.th]=(P.themes[n.th]||0)+1; }
  if(n.t==="hw"){ P.hw=P.hw||{}; P.hw[n.u]=true; }
  if(n.t==="hwcheck"){ P.hwc=P.hwc||{}; P.hwc[n.k]=true; }
  save();
  END={keys:[...new Set(L.q.map(e=>e.k).filter(Boolean))],th:n.th,xp,perfect,acc:L.graded?Math.round(L.right/L.graded*100):100,streakUp,goalHit:!goalBefore&&dayXp()>=P.goal,heartBonus,kind:n.t,u:n.u};
  if(n.t==="hw"){ END.customTitle="Grammatica dell'unità "+n.u+" completata!"; END.hero=HW[n.u-1].ic; }
  if(n.t==="hwcheck"){ END.customTitle="Verifica "+n.k+" completata!"; END.hero="🏁"; }
  screen="end"; render(); beep("win");
}

function pronTry(text,btn){
  if(!SRClass){ toast("🎤 Questo browser non riconosce la voce: usa Safari sull'iPad o Chrome/Edge sul computer"); return; }
  if(inClaude()){ toast("🎤 Dentro Claude il microfono è bloccato: apri Grammar Quest dal tuo sito GitHub"); return; }
  if(PRON){ try{ PRON.stop(); }catch(e){} return; }
  try{ speechSynthesis.cancel(); }catch(e){} try{ if(typeof AUD!=="undefined"&&AUD.el&&!AUD.el.paused) AUD.el.pause(); }catch(e){}
  let r; try{ r=new SRClass(); }catch(e){ toast("🎤 Il riconoscimento vocale non parte"); return; }
  PRON=r; r.lang="en-GB"; r.maxAlternatives=4; r.interimResults=false; btn&&btn.classList.add("on");
  pronBox(`<b>🎙️ Ti ascolto…</b><span>${esc(text)}</span>`,"",0); let got=false;
  r.onresult=ev=>{ got=true; const res=ev.results[0], alts=[]; for(let i=0;i<res.length;i++) alts.push(res[i].transcript);
    const best=alts.map(a=>({a,s:scoreSpeech(text,a)})).sort((x,y)=>y.s.score-x.s.score)[0], s=best.s, need=s.words.length>5?0.7:0.8, ok=s.score>=need;
    const words=s.words.map((w,i)=>`<span class="${s.marks[i]?"wok":"wko"}">${esc(w)}</span>`).join(" ");
    beep(ok?"ok":"bad");
    if(ok){ P.pron=P.pron||{n:0,days:{}}; P.pron.n++; const key=today()+"|"+norm(text); if(!P.pron.days[key]){ P.pron.days[key]=1; addXp(1); } save(); }
    pronBox(`<button class="px" aria-label="Chiudi">✕</button><b>${ok?(s.score>=0.99?"⭐⭐⭐ Perfetto!":"⭐⭐ Molto bene!"):"Quasi! Riprova"}</b><div class="pw">${words}</div><small>Ho sentito: «${esc(best.a)}» · ${Math.round(s.score*100)}%</small><button class="btn ghost" data-psay="${esc(text)}" style="padding:8px">🔊 Riascolta il modello</button>`,ok?"ok":"bad",ok?5000:9000); };
  r.onerror=ev=>{ const m=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Consenti il microfono al sito (su iPad attiva anche la Dettatura).":ev.error==="no-speech"?"Non ho sentito niente: riprova.":ev.error==="network"?"Serve internet per il riconoscimento della voce.":"Errore: "+ev.error;
    pronBox(`<button class="px">✕</button><b>🎤 ${m}</b>`,"bad",6000); got=true; };
  r.onend=()=>{ PRON=null; btn&&btn.classList.remove("on"); if(!got) pronBox(`<button class="px">✕</button><b>Non ho sentito niente: tocca 🎤 e riprova.</b>`,"bad",4000); };
  try{ r.start(); }catch(e){ PRON=null; btn&&btn.classList.remove("on"); }
}

/* =========================================================
   SESSIONI DI PAROLE (stile Memrise)
   ========================================================= */
function startVocab(mode,th){
  const now=Date.now(); let keys;
  if(mode==="learn"){ keys=themeWordKeys(th).filter(k=>!vState(k)).slice(0,5); }
  else { keys=Object.keys(VW).filter(k=>vState(k)&&(!th||VW[k].th===th)).sort((a,b)=>((vState(a).due<=now?0:1)-(vState(b).due<=now?0:1))||vState(a).s-vState(b).s).slice(0,10); }
  if(!keys.length){ toast("Nessuna parola da "+(mode==="learn"?"imparare":"ripassare")+" qui"); return; }
  const q=[], types=["vrev","vtype","vlisten","vmc"];
  if(mode==="learn"){ keys.forEach(k=>{ q.push({t:"vintro",k},{t:"vmc",k}); }); shuffle(keys).forEach((k,i)=>q.push({t:types[i%3],k})); }
  else keys.forEach((k,i)=>q.push({t:types[i%4],k}));
  if(reachedUnit()>=12) shuffle(keys.filter(k=>VW[k].verb)).slice(0,3).forEach(k=>q.push({t:"vpast",k}));
  V={mode,th,q,i:0,mistakes:0,graded:0,right:0,hist:{},maxI:0,ret:th&&th.startsWith("hw")?"hwunit":null}; screen="vocab"; vEnter(); window.scrollTo(0,0);
}
function vOpts(k,field){ const w=VW[k]; const pool=shuffle(Object.keys(VW).filter(x=>x!==k&&VW[x].th===w.th&&VW[x].verb===w.verb)).slice(0,3); return shuffle([k,...pool]); }
function vEnter(){ const e=V.q[V.i]; V.state="ans"; V.sel=null; V.text=""; if(["vmc","vrev","vlisten"].includes(e.t)) e.opts=vOpts(e.k);
  render(); const w=VW[e.k];
  if(e.t==="vintro") setTimeout(()=>speak(w.en+". "+w.ex),200);
  if(e.t==="vmc"||e.t==="vlisten") setTimeout(()=>speak(w.en),200); }
function vCheck(){ const e=V.q[V.i], w=VW[e.k]; let ok=false;
  if(["vmc","vrev","vlisten"].includes(e.t)) ok=V.sel===e.k;
  if(e.t==="vtype") ok=norm(V.text)===norm(w.en);
  if(e.t==="vpast") ok=norm(V.text)===norm(w.past);
  V.graded++; if(ok){ V.right++; vGood(e.k); beep("ok"); speak(e.t==="vpast"?w.past:w.en); }
  else { V.mistakes++; vBad(e.k); beep("bad"); if(!e.retry) V.q.push(Object.assign({},e,{retry:true})); }
  V.state=ok?"ok":"bad"; V.hist[V.i]={state:V.state,sel:V.sel,text:V.text}; save(); render(); }
/* tornare indietro: si rivede la carta precedente (le risposte già date restano com'erano) */
function vRestore(){ const h=V.hist[V.i]; if(h){ V.state=h.state; V.sel=h.sel; V.text=h.text; } else if(V.q[V.i].t==="vintro"){ V.state="ans"; V.sel=null; V.text=""; } }
function vBack(){ if(V.i<=0) return; try{ speechSynthesis.cancel(); }catch(e){} V.i--; vRestore(); render(); const e=V.q[V.i], w=VW[e.k]; if(e.t==="vintro") speak(w.en+". "+w.ex); }
function vNext(){ if(V.q[V.i].t==="vintro"){ const k=V.q[V.i].k; P.words=P.words||{}; if(!P.words[k]) P.words[k]={s:0,due:Date.now(),ok:0,ko:0}; save(); }
  V.i++; if(V.i<V.q.length && (V.hist[V.i]||V.i<V.maxI)){ if(V.hist[V.i]) vRestore(); else if(V.q[V.i].t==="vintro"){ V.state="ans"; } else { vEnter(); return; } V.maxI=Math.max(V.maxI,V.i); render(); return; }
  V.maxI=Math.max(V.maxI||0,V.i);
  if(V.i>=V.q.length){ const perfect=V.mistakes===0; rewardEnd("vocab",10+(perfect?5:0),perfect,V.graded?Math.round(V.right/V.graded*100):100,V.mode==="learn"?"Parole nuove piantate! 🌱":"Parole annaffiate! 💧","🧠"); } else vEnter(); }
function renderVocab(a){
  const e=V.q[V.i], w=VW[e.k], pct=Math.round(V.i/V.q.length*100), lock=V.state!=="ans";
  const T={vintro:"Parola nuova",vmc:"Che cosa significa?",vrev:"Come si dice in inglese?",vtype:"Scrivi in inglese",vlisten:"Ascolta: che parola è?",vpast:"Qual è il passato?"};

    <h2 class="task">${T[e.t]}${e.retry?" <span class='kind' style='color:var(--bad)'>· da rifare</span>":""}</h2>`;
  if(e.t==="vintro"){
    h+=`<div class="card" style="align-items:center;text-align:center"><span class="badge-new">${w.verb?"VERBO NUOVO":"PAROLA NUOVA"}</span>
      <div class="vword">${esc(w.en)} <button class="spk" data-say="${esc(w.en)}" aria-label="Ascolta">🔊</button></div>
      ${w.verb?`<div class="vpast">passato: <b>${esc(w.past)}</b> <button class="spk" data-say="${esc(w.past)}" aria-label="Ascolta">🔊</button></div>`:""}
      <div class="vit">🇮🇹 ${esc(w.it)}</div>
      <div class="exrow" style="text-align:left;width:100%"><button class="spk" data-say="${esc(w.ex)}">🔊</button><div><div>${hintify(w.ex,"en")}</div><span>${esc(w.exIt)}</span></div></div></div>`;
  }
  if(e.t==="vmc"||e.t==="vlisten"){
    h+= e.t==="vmc" ? `<div class="card" style="align-items:center"><div class="vword">${esc(w.en)} <button class="spk" data-say="${esc(w.en)}">🔊</button></div></div>`
      : `<div class="listen"><button class="big" id="say" aria-label="Ascolta">🔊</button><button class="slow" id="slowsay" aria-label="Più lento">🐢</button></div>`;
    h+=`<div class="opts">${e.opts.map((k,i)=>`<button class="opt ${V.sel===k?"sel":""}" data-vo="${k}" ${lock?"disabled":""}><span class="k">${i+1}</span>${esc(VW[k].it)}</button>`).join("")}</div>`;
  }
  if(e.t==="vrev"){
    h+=`<div class="card" style="align-items:center"><div class="vit" style="font-size:24px">🇮🇹 ${esc(w.it)}</div></div>
      <div class="opts">${e.opts.map((k,i)=>`<button class="opt ${V.sel===k?"sel":""}" data-vo="${k}" ${lock?"disabled":""}><span class="k">${i+1}</span>${esc(VW[k].en)}</button>`).join("")}</div>`;
  }
  if(e.t==="vtype"||e.t==="vpast"){
    h+=`<div class="card" style="align-items:center">${e.t==="vtype"?`<div class="vit" style="font-size:24px">🇮🇹 ${esc(w.it)}</div>`:`<div class="vword">${esc(w.en)}</div><div class="vit">${esc(w.it)} → passato?</div>`}</div>
      <input class="vin" id="vin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${e.t==="vpast"?"es. went":"in inglese…"}" value="${esc(V.text)}" ${lock?"disabled":""}>`;
  }
  let d="";
  if(e.t==="vintro") d=`<div class="row">${V.i>0?`<button class="btn ghost" id="vback2" style="flex:1">⟵ Indietro</button>`:""}<button class="btn" id="vnx" style="flex:2">Ho capito, continua</button></div>`;
  else if(V.state==="ok") d=`<div class="sheet ok"><h3>✅ ${pick(PRAISE)}</h3><p class="model">${esc(w.en)}${w.verb?" → "+esc(w.past):""} = ${esc(w.it)}</p><button class="btn" id="vnx">Continua</button></div>`;
  else if(V.state==="bad") d=`<div class="sheet bad"><h3>❌ Risposta corretta:</h3><p class="model">${esc(e.t==="vpast"?w.en+" → "+w.past:w.en)} = ${esc(w.it)} <button class="spk" data-say="${esc(e.t==="vpast"?w.past:w.en)}">🔊</button></p><p class="why">${hintify(w.ex,"en")}<br><span style="color:var(--muted)">${esc(w.exIt)}</span></p><button class="btn bad" id="vnx">Continua</button></div>`;
  else d=`<button class="btn" id="vck" ${(V.sel||V.text.trim())?"":"disabled"}>Controlla</button>`;
  h+=`<div class="dock">${d}</div>`;
  a.innerHTML=h;
  $("#exit").onclick=()=>{ if(V.ret){ screen=V.ret; } else { screen="home"; tab="words"; } render(); };
  a.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const sy=$("#say"); if(sy) sy.onclick=()=>speak(w.en); const ss=$("#slowsay"); if(ss) ss.onclick=()=>speak(w.en,0.6);
  a.querySelectorAll("[data-vo]").forEach(b=>b.onclick=()=>{ V.sel=b.dataset.vo; beep("tick"); render(); });
  const vi=$("#vin"); if(vi){ vi.oninput=()=>{ V.text=vi.value; const c=$("#vck"); if(c) c.disabled=!V.text.trim(); }; vi.onkeydown=ev=>{ if(ev.key==="Enter"&&V.text.trim()&&V.state==="ans") vCheck(); }; if(!lock) setTimeout(()=>{try{vi.focus({preventScroll:true});}catch(x){}},50); }
  const ck=$("#vck"); if(ck) ck.onclick=vCheck;
  const vb=$("#vback"); if(vb) vb.onclick=vBack; const vb2=$("#vback2"); if(vb2) vb2.onclick=vBack;

/* =========================================================
   DIALOGHI (stile Duolingo Stories)
   ========================================================= */
function startDialog(th,i,ret){ if(!ret) TH=th; const d=DIALOGS[th][i]; D={ret,th,i,d,step:0,shown:[],mistakes:0,picks:0,wrong:[],tr:{},qdone:false,qsel:null,qopts:shuffle(d.q[1].map((x,j)=>j))}; screen="dialog"; dAdvance(); window.scrollTo(0,0); }
function dAdvance(){
  const L2=D.d.lines;
  if(D.step<L2.length && L2[D.step][0]==="A"){ D.shown.push({who:"A",en:L2[D.step][1],it:L2[D.step][2]}); D.step++; render(); speak(D.shown[D.shown.length-1].en,1,1.15); return; }
  render();
}
function dPick(j){
  const ln=D.d.lines[D.step];
  if(j===0){ D.picks++; D.shown.push({who:"U",en:ln[1][0],it:ln[2]}); D.step++; beep("ok"); speak(ln[1][0]); D.lastWhy=null; render(); }
  else { if(!D.wrong.includes(j)){ D.wrong.push(j); D.mistakes++; } beep("bad"); D.lastWhy=ln[3]; render(); }
}
function renderDialog(a){
  const d=D.d, L2=d.lines, total=L2.length+1, pct=Math.round(Math.min(D.step,L2.length)/total*100);
  let h=`<div class="lbar"><button class="x" id="exit" aria-label="Esci">✕</button><div class="prog"><span style="width:${pct}%"></span></div><span class="hearts">💬</span></div>
    <div class="dhead"><span style="font-size:34px">${d.av}</span><div><b>${esc(d.title)}</b><br><small>${esc(d.who)} · livello ${d.lv}</small></div></div>
    <div class="chat">${D.shown.map((s,i)=>`<div class="msg ${s.who==="U"?"me":""}"><div class="mb">${hintify(s.en,"en")} <button class="spk" data-say="${esc(s.en)}" aria-label="Ascolta">🔊</button>
      <button class="trb" data-tr="${i}" aria-label="Traduzione">🇮🇹</button>${D.tr[i]?`<div class="mit">${esc(s.it)}</div>`:""}</div></div>`).join("")}</div>`;
  let d2="";
  if(D.step<L2.length){
    const ln=L2[D.step];
    if(ln[0]==="U"){
      if(D.optsStep!==D.step){ D.opts=shuffle([0,1,2]); D.wrong=[]; D.optsStep=D.step; D.lastWhy=null; }
      h+=`<div class="card" style="gap:8px"><span class="kind">Tocca a te · vuoi dire:</span><div style="font-weight:700">🇮🇹 ${esc(ln[2])}</div>
        <div class="opts">${D.opts.map(j=>`<button class="opt" data-dp="${j}" ${D.wrong.includes(j)?"disabled style='opacity:.45;text-decoration:line-through'":""}>${esc(ln[1][j])}</button>`).join("")}</div>
        ${D.lastWhy?`<div class="sheet bad" style="padding:10px"><p class="why">💡 ${esc(D.lastWhy)}</p></div>`:""}</div>`;
    } else d2=`<button class="btn" id="dnx">Continua ▶</button>`;
  } else if(!D.qdone){
    const q=d.q; h+=`<div class="card" style="gap:8px"><span class="kind">Domanda di comprensione</span><div style="font-weight:800;font-size:18px">${esc(q[0])}</div>
      <div class="opts">${D.qopts.map(j=>`<button class="opt ${D.qsel===j?"sel":""}" data-dq="${j}">${esc(q[1][j])}</button>`).join("")}</div>
      ${D.qbad?`<p class="why" style="color:var(--bad);margin:0">Non è giusto: rileggi il dialogo (puoi toccare 🇮🇹 per la traduzione) e riprova.</p>`:""}</div>`;
  } else d2=`<button class="btn" id="dend">Fine del dialogo 🎉</button>`;
  h+=`<div class="dock">${d2}</div>`;
  a.innerHTML=h;
  $("#exit").onclick=()=>{ screen=D.ret||"theme"; render(); };
  a.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  a.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{ D.tr[b.dataset.tr]=!D.tr[b.dataset.tr]; render(); });

let samplePromise=null;
function getSample(){ if(!(window.claude&&window.claude.use)) return Promise.resolve(null); return samplePromise||(samplePromise=window.claude.use("sample").catch(()=>null)); }
const SCEN={travel:"at the reception of a small hotel in London; the learner is a guest who just arrived",food:"in a restaurant in London; the learner is a customer ordering dinner",friends:"at a friend's party; the learner meets you for the first time",work:"at a business meeting about a real estate project; the learner is an Italian engineer",sport:"at a sports club; the learner wants to join and talk about sports",relax:"on a quiet beach on holiday; you meet the learner and chat about free time",sea:"in a marina; the learner arrives with a motor boat and needs a berth and information",shopping:"in a clothes shop; the learner wants to buy something"};
function startChat(th){
  const t=THEMES.find(x=>x.id===th), d=(DIALOGS[th]||[])[0];
  C={th,char:d?d.who.split(",")[0]:"a friendly local",av:d?d.av:"🙂",turns:[],msgs:[],busy:false,err:null,userCount:0,rewarded:false,tr:{}};
  screen="chat"; render(); chatSend(null);
}
function chatRules(){
  const t=THEMES.find(x=>x.id===C.th), r=reachedUnit();
  const gram=CONTENT_UNITS.filter(u=>u<=r).map(u=>TITLES[u]).join("; ");
  return `You are role-playing to help an Italian adult practise English. He is a beginner (he knows many words but finds conversation hard).
Scenario: ${SCEN[C.th]}. You are ${C.char}. Topic: ${t.nm}.
Rules for YOUR lines: simple British English, at most 2 short sentences, friendly, and always end with a simple question to keep the conversation going. Use only these grammar structures the learner has studied: ${gram}. Use everyday words about the topic.
When the learner writes, check his English. Reply ONLY with one JSON object, no other text:
{"reply":"your next line in English","reply_it":"Italian translation of your line","correction":"if the learner's last message has mistakes, a short explanation in Italian (max 2 sentences); otherwise empty string","better":"the learner's message corrected or made more natural in English; empty string if it was already correct"}
If the learner's message is START, open the conversation in character (correction and better empty). If he writes in Italian, answer in English and put in "better" how to say his sentence in English.`;
}
async function chatSend(text){
  if(C.busy) return;
  const sample=await getSample();
  if(!sample){ C.err="offline"; render(); return; }
  if(text){ C.msgs.push({who:"U",en:text}); C.turns.push({role:"user",content:text}); C.userCount++; }
  else C.turns.push({role:"user",content:"START"});
  C.busy=true; C.err=null; render();
  try{
    const turns=C.turns.slice(-16);
    const res=await sample.json([{role:"user",content:chatRules()},...turns],{modelTier:"quick",cache:false});
    const reply=String(res&&res.reply||"").trim(); if(!reply) throw {code:"empty_completion"};
    if(text && (res.correction||res.better)){ const m=C.msgs[C.msgs.length-1]; m.correction=String(res.correction||""); m.better=String(res.better||""); }
    C.msgs.push({who:"A",en:reply,it:String(res.reply_it||"")}); C.turns.push({role:"assistant",content:reply});
    speak(reply,1,1.1);
  }catch(e){ C.err=(e&&e.code)||"upstream_error"; if(text&&C.turns.length&&C.turns[C.turns.length-1].role==="user"){} }
  C.busy=false; render();
}

function hwStatus(n){ let d=0; if((P.hw||{})[n]) d++; if((P.dialogs||{})["hw"+n+":0"]) d++; if((P.cinema||{})["hwr"+n]) d++; const s=vStats(themeWordKeys("hw"+n)); if(s.neu===0) d++; return d; }
function buildHw(node){
  const ex=[];
  if(node.t==="hw"){
    const ks=shuffle(HW[node.u-1].items.map((_,i)=>"h:"+node.u+":"+i));
    const seq=["gap","gap","build","listen","gap","type","build","type"];
    ks.forEach((k,i)=>ex.push(mk(seq[i%seq.length],k)));
    reviewPick(2,null).filter(k=>!ks.includes(k)).forEach((k,i)=>ex.splice(4+i*3,0,mk("build",k)));
    if(speakAvailable()){ ex.splice(5,0,{t:"speak",k:ks[0]}); ex.push({t:"speak",k:ks[1]}); }
  } else {
    const units=HW_CHECKS.find(c=>c.k===node.k).units;
    shuffle([].concat(...units.map(n=>HW[n-1].items.map((_,i)=>"h:"+n+":"+i)))).slice(0,12).forEach((k,i)=>ex.push(mk(["gap","build","type","listen"][i%4],k)));
    if(speakAvailable()){ ex.splice(4,0,{t:"speak",k:ex[0].k}); ex.push({t:"speak",k:ex[ex.length-2].k}); }
  }
  return ex;
}

/* versione offline: trova da sola gli MP3 dei CD vicino al file del gioco */
function aProbe(){
  if(AUD.probing||AUD.probed||location.protocol!=="file:") return; AUD.probing=true;
  const found=[];
  const test=url=>new Promise(res=>{ const au=new Audio(); au.preload="metadata"; let d=false; const ok=()=>{ if(!d){ d=true; res(au.duration||null); } }, ko=()=>{ if(!d){ d=true; res(false); } };
    au.addEventListener("loadedmetadata",ok,{once:true}); au.addEventListener("error",ko,{once:true}); setTimeout(ko,2500); au.src=encodeURI(url); });
  (async()=>{
    for(const cd of CDORD){ const C=CDS[cd]; const first=Math.min(...Object.keys(C.map).map(Number));
      let base=null; for(const b of C.bases){ if(await test(b+C.fn(first))!==false){ base=b; break; } }
      if(base===null) continue;
      let miss=0; for(let n=first;n<=150&&miss<3;n++){ if(!C.map[n]) { miss++; continue; } const url=base+C.fn(n), r=await test(url); if(r===false){ miss++; continue; } miss=0; found.push({id:tid(cd,n),cd,n,name:C.fn(n),url:encodeURI(url),dur:r}); }
    }
    AUD.probing=false; AUD.probed=true;
    if(found.length){ AUD.files=found; const cds=[...new Set(found.map(x=>CDS[x.cd].short))].join(", "); toast("🎧 Trovate "+found.length+" tracce ("+cds+")"); if(screen==="home"&&tab==="audio"&&!aTyping()) render(); }
  })();
}

/* ---------- 📝 trascrizione automatica sul dispositivo dell'utente ---------- */
const TR={busy:false,msg:"",err:"",id:"",cache:{}};
const TJS="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";
let asrP=null;
async function asrPipe(onp){
  if(asrP) return asrP;
  asrP=(async()=>{ const T=await import(TJS); T.env.allowLocalModels=false;
    let cacheOk=false; try{ cacheOk=typeof caches!=="undefined"&&!!(await caches.open("gq-test")); }catch(e){} T.env.useBrowserCache=cacheOk;
    return T.pipeline("automatic-speech-recognition","Xenova/whisper-base.en",{progress_callback:onp}); })();
  asrP.catch(()=>{ asrP=null; }); return asrP;
}
async function trGet(id){ if(TR.cache[id]!==undefined) return TR.cache[id]; const v=await idbGet("tr:"+id); TR.cache[id]=v||null; return TR.cache[id]; }
async function trRun(id){
  const f=fileOf(id); if(!f){ toast("Prima apri la cartella del CD con 📁"); return; }
  TR.busy=true; TR.id=id; TR.err=""; TR.msg="Preparo l'audio…"; render();
  try{
    let buf; try{ buf=await (await fetch(f.url)).arrayBuffer(); }catch(e){ throw new Error("nofile"); }
    const ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    const ab=await ctx.decodeAudioData(buf); let pcm=ab.getChannelData(0);
    if(ab.numberOfChannels>1){ const r=ab.getChannelData(1), m=new Float32Array(pcm.length); for(let i=0;i<m.length;i++) m[i]=(pcm[i]+r[i])/2; pcm=m; }
    try{ ctx.close(); }catch(e){}
    TR.msg="Carico il riconoscimento vocale (la prima volta scarica circa 80 MB)…"; trMsg();
    const asr=await asrPipe(p=>{ if(p&&p.status==="progress"&&p.file&&/onnx/.test(p.file)){ TR.msg="Scarico il modello: "+Math.round(p.progress||0)+"%"; trMsg(); } });
    TR.msg="Trascrivo… (può richiedere circa metà della durata della traccia)"; trMsg();
    const out=await asr(pcm,{chunk_length_s:30,stride_length_s:5,return_timestamps:true});
    const chunks=(out.chunks||[]).map(c=>({s:c.timestamp[0]||0,e:c.timestamp[1]==null?(c.timestamp[0]||0)+5:c.timestamp[1],t:String(c.text||"").trim()})).filter(c=>c.t);
    const v={chunks:chunks.length?chunks:[{s:0,e:ab.duration,t:String(out.text||"").trim()}],at:Date.now()};
    TR.cache[id]=v; await idbPut("tr:"+id,v); toast("📝 Trascrizione pronta");
  }catch(e){ TR.err=e&&e.message==="nofile"?"nofile":"fail"; asrP=null; }
  TR.busy=false; if(screen==="home"&&tab==="audio") render();
}

const SH={phase:"",rec:null,chunks:[],stream:null,end:null,start:null,clips:{},err:""};
function shReset(){ if(SH.rec&&SH.rec.state==="recording") try{ SH.rec.stop(); }catch(e){} SH.phase=""; SH.end=null; }
function shSeg(){ const el=AUD.el; if(!el) return null;
  if(AUD.a!=null&&AUD.b!=null) return [AUD.a,AUD.b];
  const t=el.currentTime||0; return t<1?[0,Math.min(5,el.duration||5)]:[Math.max(0,t-5),t]; }
async function shGo(){
  if(AUD.cur<0||(AUD.files[AUD.cur]||{}).id!==AUD.sel){ toast("Prima fai partire questa traccia"); return; }
  if(!(navigator.mediaDevices&&window.MediaRecorder)){ SH.err="nosup"; render(); return; }
  try{ SH.stream=SH.stream||await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ SH.err="mic"; render(); return; }
  SH.err=""; const [a,b]=shSeg(); const el=aEl(); SH.start=a; SH.end=AUD.loop?null:b; SH.len=b-a; SH.phase="play";
  el.currentTime=a; el.play().catch(()=>{}); render();
}
function shRecord(){
  if(SH.phase!=="play") return; SH.phase="rec"; beep("ok");
  const id=AUD.files[AUD.cur]&&AUD.files[AUD.cur].id; SH.chunks=[];
  try{ SH.rec=new MediaRecorder(SH.stream); }catch(e){ SH.err="nosup"; SH.phase=""; render(); return; }
  SH.rec.ondataavailable=e=>{ if(e.data&&e.data.size) SH.chunks.push(e.data); };
  SH.rec.onstop=()=>{ const blob=new Blob(SH.chunks,{type:SH.rec.mimeType||"audio/webm"}); if(id){ if(SH.clips[id]) try{ URL.revokeObjectURL(SH.clips[id].url); }catch(e){} SH.clips[id]={url:URL.createObjectURL(blob),a:SH.start,b:SH.start+SH.len}; }
    SH.phase=""; aMeta(id).said=(aMeta(id).said||0)+1; save(); if(!aTyping()) render(); setTimeout(()=>shPlayMine(id),250); };
  SH.rec.start(); render();
  setTimeout(()=>{ if(SH.rec&&SH.rec.state==="recording") SH.rec.stop(); }, Math.min(20000,(SH.len/aRate())*1000+1800));
}
function shPlayMine(id){ const c=SH.clips[id]; if(!c) return; const au=new Audio(c.url); au.play().catch(()=>{}); }
function shPlayOrig(id){ const c=SH.clips[id]; if(!c||!AUD.el) return; SH.phase="play2"; const el=AUD.el; el.currentTime=c.a; el.play().catch(()=>{});
  const stop=()=>{ if(el.currentTime>=c.b){ el.pause(); el.removeEventListener("timeupdate",stop); SH.phase=""; } }; el.addEventListener("timeupdate",stop); }

/* =========================================================
   ERRORI: quale regola hai ignorato (confronto + regola dell'unità + spiegazione di Claude)
   ========================================================= */
function ruleFor(it,mine){
  let u=it.u||0, src="", title="", lines=[];
  if(!u && it.th){ const ix=+String(it.k).split(":")[2]; u=(THEME_REQ[it.th]||[])[ix]||0; }
  if(u && UNITS[u]){ lines=UNITS[u].guide; title="Grammatica · unità "+u+" · "+TITLES[u]; src="u"; }
  else if(it.hw && HW[it.hw-1]){ const h=HW[it.hw-1]; lines=h.guide; title="Corso · unità "+h.n+" · "+h.title; src="hw"; }
  if(!lines.length) return null;
  const plain=s=>String(s).replace(/<[^>]+>/g," ").toLowerCase();
  const toks=new Set(norm(it.ans+" "+(it.wrong||[]).join(" ")+" "+it.en).split(" ").filter(w=>w.length>1));
  const whyT=new Set(norm(it.why).split(" ").filter(w=>w.length>3));
  const hot=new Set(); let orderOnly=false;
  if(mine){ const a=norm(mine).split(" ").filter(Boolean), b=norm(it.en).split(" ").filter(Boolean);
    if(a.length && a.slice().sort().join(" ")===b.slice().sort().join(" ")) orderOnly=true;
    b.filter(w=>!a.includes(w)).concat(a.filter(w=>!b.includes(w))).forEach(w=>hot.add(w)); }
  const ORD=["inverte","invertono","prima","dopo","ordine","domanda","domande","posto","va","vanno"];
  let best=0, bs=-1;
  lines.forEach((l,i)=>{ const w=norm(plain(l)).split(" "); let s=0;
    w.forEach(x=>{ if(hot.has(x)) s+=5; if(orderOnly&&ORD.includes(x)) s+=6; if(toks.has(x)) s+=(mine?1:2); if(!mine&&whyT.has(x)) s+=1; });
    s=s/Math.sqrt(w.length+4); if(s>bs){ bs=s; best=i; } });
  return {title,lines,best,u,src};
}

/* confronto parola per parola (LCS) */
function wdiff(a,b){
  const A=a.split(/\s+/).filter(Boolean), B=b.split(/\s+/).filter(Boolean), n=A.length, m=B.length;
  const key=w=>norm(w), D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) D[i][j]=key(A[i])===key(B[j])?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const inA=new Array(n).fill(false), inB=new Array(m).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(key(A[i])===key(B[j])){ inA[i]=inB[j]=true; i++; j++; } else if(D[i+1][j]>=D[i][j+1]) i++; else j++; }
  return {A,B,inA,inB};
}
function diagnose(mine,right){
  const a=norm(mine).split(" ").filter(Boolean), b=norm(right).split(" ").filter(Boolean);
  if(!a.length) return "";
  const sa=a.slice().sort().join(" "), sb=b.slice().sort().join(" ");
  if(sa===sb) return "Hai usato le parole giuste, ma <b>nell'ordine sbagliato</b>: in inglese l'ordine delle parole è fisso.";
  const miss=b.filter(w=>!a.includes(w)), extra=a.filter(w=>!b.includes(w));
  const bits=[];
  if(miss.length) bits.push("ti manca <b>"+esc(miss.slice(0,3).join(", "))+"</b>");
  if(extra.length) bits.push("hai messo <b>"+esc(extra.slice(0,3).join(", "))+"</b> che non ci va");
  return bits.length? "Rispetto alla frase giusta "+bits.join(" e ")+"." : "";
}

  const it=IT[e.k], mine=myAnswer(e), R=ruleFor(it,mine), X=L.expl;

  if(X&&X.k===e.k){
    if(X.busy) h+=`<p class="why">⏳ Claude sta preparando la spiegazione…</p>`;
    else if(X.err) h+=`<p class="why">${esc(X.err)}</p>`;

      ${(X.ex||[]).map(r=>`<p class="exl"><button class="spk" data-say="${esc(r[0])}" aria-label="Ascolta">🔊</button> ${esc(r[0])}<br><span>${esc(r[1]||"")}</span></p>`).join("")}</div>`;
  } else h+=`<button class="btn ghost small" id="explain">🤔 Spiegami meglio il mio errore</button>`;
  return h;
}
